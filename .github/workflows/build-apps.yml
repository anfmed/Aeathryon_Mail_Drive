name: build-apps
# শুধু হাতে চালানো (Run workflow)। ধাপ: check (analyze + test) -> সফল হলেই build।
# check-এ ত্রুটি থাকলে build একেবারেই চলে না।
# আপাতত: Android + Windows। Linux = নিচের checkbox। iOS/macOS: বাদ (পরে)।
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: "Linux-ও build করুন"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: check (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter (official repo)
        shell: bash
        run: bash tools/install_flutter.sh
      - name: Pure-Dart packages - analyze + test
        shell: bash
        run: bash tools/ci_core.sh
      - name: SQL schema validation
        run: python3 tools/validate_schema.py
      - name: Flutter package + apps - analyze + test
        shell: bash
        run: |
          set -e
          for d in packages/aethryon_design apps/drive_app apps/mail_app; do
            echo "=== $d ==="
            (cd "$d" && flutter pub get && flutter analyze --no-fatal-infos && { [ ! -d test ] || flutter test; })
          done

  plan:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          INCLUDE_LINUX: ${{ inputs.include_linux }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          targets = [
            {"target": "android", "os": "ubuntu-latest",  "platform": "android", "cmd": "flutter build apk --release --split-per-abi"},
            {"target": "windows", "os": "windows-latest", "platform": "windows", "cmd": "flutter build windows --release"},
          ]
          if os.environ.get("INCLUDE_LINUX") == "true":
            targets.append({"target": "linux", "os": "ubuntu-latest", "platform": "linux", "cmd": "flutter build linux --release"})
          include = [dict(t, app=a) for a in ("drive_app", "mail_app") for t in targets]
          print("matrix=" + json.dumps({"include": include}))
          PY

  build:
    name: ${{ matrix.app }} / ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter (official repo)
        shell: bash
        run: bash tools/install_flutter.sh
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable desktop platform
        if: matrix.target != 'android'
        shell: bash
        run: flutter config --enable-${{ matrix.platform }}-desktop || true
      - name: Android licenses
        if: matrix.target == 'android'
        shell: bash
        run: yes | flutter doctor --android-licenses || true
      - name: Generate platform folder (not committed yet)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          flutter create --platforms=${{ matrix.platform }} --project-name ${{ matrix.app }} "$tmp/gen"
          cp -R "$tmp/gen/${{ matrix.platform }}" "apps/${{ matrix.app }}/"
      - name: Build
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          ${{ matrix.cmd }}
      - name: Size report
        shell: bash
        working-directory: apps/${{ matrix.app }}/build
        run: |
          echo "## ${{ matrix.app }} ${{ matrix.target }}" | tee -a "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 7 \( -name "*.apk" -o -name "*.exe" -o -name "libapp.so" -o -name "*.dll" \) -print0 \
            | xargs -0 du -sk 2>/dev/null | sort -rn | head -15 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}
          path: apps/${{ matrix.app }}/build/**/release/**
          if-no-files-found: warn
          retention-days: 7
