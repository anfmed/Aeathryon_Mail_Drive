name: format
# প্রতিটি push-এ নিজে চলে (কোনো path/branch ফিল্টার নেই): `dart format` চালিয়ে বদল থাকলে commit ফেরত পাঠায়।
# bot-এর নিজের push নতুন workflow চালু করে না, আর নিচে actor-guard-ও আছে — তাই লুপ হয় না।
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter (official repo)
        shell: bash
        run: bash tools/install_flutter.sh
      - name: dart format
        shell: bash
        run: |
          # সিনট্যাক্স-ত্রুটিযুক্ত ফাইল format হয় না (exit 65), বাকিগুলো হয়; ত্রুটি ধরবে ci-র check ধাপ।
          dart format packages apps || echo "::warning::some files could not be formatted (syntax errors?)"
      - name: Commit formatting changes (if any)
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A packages apps
            git commit -m "style: dart format [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
