version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  aethryon_capability: {path: ../aethryon_capability}
  aethryon_net: {path: ../aethryon_net}
  aethryon_platform: {path: ../aethryon_platform}
